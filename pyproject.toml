[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renewable-asset-intelligence"
version = "0.1.0"
description = "Local-first predictive maintenance intelligence for wind and solar assets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
domain = ["pvlib>=0.11", "ruptures>=1.1"]
agent = ["cactus-needle>=0.1"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["rai*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
    "E501",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "B008",
    "PLC0415",
    "PLW0603",
    "PLR0917",
    "PLR0911",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"scripts/*" = ["E402"]
